<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem("krixora-theme");
                var theme = (stored === "dark" || stored === "light")
                    ? stored
                    : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
                document.documentElement.dataset.theme = theme;
            } catch (e) {}
        })();
    </script>
    <title>Page not found — KRIXORA</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#05070d">
    <link rel="icon" href="assets/icons/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070d;
            --text: #f4f7ff;
            --muted: #aab4c7;
            --blue: #2f8cff;
            --blue-bright: #5aa9ff;
            --border: rgba(255, 255, 255, 0.09);
        }
        html[data-theme="light"] {
            --bg: #f4f7fc;
            --text: #0a1220;
            --muted: #526075;
            --blue: #1673e6;
            --blue-bright: #1f7aef;
            --border: rgba(15, 28, 50, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, system-ui, sans-serif;
            background:
                radial-gradient(ellipse 50% 40% at 20% 20%, rgba(47, 140, 255, 0.1), transparent 60%),
                radial-gradient(ellipse 40% 35% at 80% 70%, rgba(47, 140, 255, 0.06), transparent 65%),
                var(--bg);
            color: var(--text);
        }
        .card {
            width: min(440px, 100%);
            padding: 40px 32px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.03);
        }
        html[data-theme="light"] .card {
            background: rgba(255, 255, 255, 0.55);
        }
        .code {
            font-family: Sora, Inter, sans-serif;
            font-size: clamp(4rem, 12vw, 5.5rem);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 20%, #5aa9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        html[data-theme="light"] .code {
            background: linear-gradient(135deg, #0a1220 15%, #1673e6);
            -webkit-background-clip: text;
            background-clip: text;
        }
        h1 {
            margin-top: 16px;
            font-family: Sora, Inter, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }
        p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 28px;
        }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        a:hover { transform: translateY(-2px); }
        .primary {
            color: #fff;
            background: linear-gradient(135deg, #2585f5, #1469d2);
            box-shadow: 0 10px 28px rgba(47, 140, 255, 0.2);
        }
        .secondary {
            color: var(--text);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
        }
        .brand {
            margin-top: 28px;
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
        .brand span { color: var(--blue-bright); font-weight: 700; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code" aria-hidden="true">404</div>
        <h1>This page doesn’t exist</h1>
        <p>The link may be broken, or the page was moved. Head back home and keep exploring.</p>
        <div class="actions">
            <a class="primary" href="/">Back to home</a>
            <a class="secondary" href="/#projects">View projects</a>
        </div>
        <p class="brand">Built by <span>KRIXORA</span></p>
    </main>
</body>
</html>
